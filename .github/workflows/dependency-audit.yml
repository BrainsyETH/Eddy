# .github/workflows/dependency-audit.yml
# Runtime dependency audit and SBOM for the web app, in its own workflow.
#
# It was a job inside App CI. An unresolved upstream advisory then made every
# App CI run on main red, so a real test or bundle failure looked the same as
# the usual one. Here the advisory fails only this workflow.
#
# Pull requests run without path filters so the `dependency-audit` check always
# emits (see CLAUDE.md for when to make it required). Pushes to main run only
# when the dependency set or this file changes: nothing else can change the
# result, and the SBOM is per lockfile.

name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'missouri-float-planner/package.json'
      - 'missouri-float-planner/package-lock.json'
      - '.github/workflows/dependency-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Generate the SBOM before the audit so it remains available when a newly
  # published advisory makes this check fail.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: missouri-float-planner
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: missouri-float-planner/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate CycloneDX SBOM
        run: npm sbom --package-lock-only --sbom-format cyclonedx > "$RUNNER_TEMP/eddy-sbom.cdx.json"

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eddy-sbom-${{ github.sha }}
          path: ${{ runner.temp }}/eddy-sbom.cdx.json
          retention-days: 14

      - name: Reject high-severity runtime advisories
        run: npm audit --omit=dev --audit-level=high
