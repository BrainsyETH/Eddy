# .github/workflows/render-reusable.yml
# Containerized render core shared by render-clip.yml and render-social-video.yml.
# A preflight checks whether the prebuilt image exists; if so the fast container
# job renders from the baked bundle, otherwise a runtime fallback job renders the
# old way (checkout + npm ci + render via the entry point) — so a missing/broken
# image degrades to "slow" instead of breaking every render. The fallback never
# runs when the image is present, so it can't affect the hot path.
#
# Both jobs run the SAME scripts/render-core.sh (render + audio + upload): baked
# into the image for the container, run from the checkout for the fallback — one
# source of truth, no checkout (or git) needed inside the container.

name: Render (reusable)

on:
  workflow_call:
    inputs:
      composition_id:
        description: 'Remotion composition id to render'
        required: true
        type: string
      input_props:
        description: 'JSON-encoded input props'
        required: true
        type: string
      output_filename:
        description: 'Output filename stem (no extension)'
        required: true
        type: string
      blob_prefix:
        description: 'Vercel Blob path prefix (clips | social-videos)'
        required: true
        type: string
      audio_mode:
        description: 'clip = keep the clip audio; social = mux + validate background music'
        required: true
        type: string
    secrets:
      OPENAI_API_KEY:
        required: false
      BLOB_READ_WRITE_TOKEN:
        required: true
    outputs:
      clip_url:
        description: 'Public Blob URL of the finished MP4 (from whichever path ran)'
        value: ${{ jobs.container-render.outputs.clip_url || jobs.runtime-render.outputs.clip_url }}
      audio_verified:
        value: ${{ jobs.container-render.outputs.audio_verified || jobs.runtime-render.outputs.audio_verified }}
      audio_kib:
        value: ${{ jobs.container-render.outputs.audio_kib || jobs.runtime-render.outputs.audio_kib }}
      total_silence_s:
        value: ${{ jobs.container-render.outputs.total_silence_s || jobs.runtime-render.outputs.total_silence_s }}

jobs:
  # Use an image only when it contains this revision of the renderer.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      packages: read
      contents: read
    outputs:
      use_container: ${{ steps.check.outputs.use_container }}
      image: ${{ steps.check.outputs.image }}
    steps:
      - name: Checkout render revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check render image
        id: check
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Follow first-parent merge history: the image is tagged with the
          # main push SHA, not an individual commit inside the merged PR.
          RENDER_REVISION=$(bash missouri-float-planner/remotion/scripts/render-revision.sh)
          test -n "$RENDER_REVISION"
          RENDER_IMAGE="ghcr.io/brainsyeth/eddy-remotion:$RENDER_REVISION"
          echo "image=$RENDER_IMAGE" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$RENDER_IMAGE" >/dev/null 2>&1; then
            echo "use_container=true" >> "$GITHUB_OUTPUT"
            echo "Rendering revision $RENDER_REVISION from its immutable image."
          else
            echo "::warning::Image for $RENDER_REVISION unavailable — rendering the checked-out revision at runtime."
            echo "use_container=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Fast path: render in the prebuilt /app/remotion/build bundle.
  container-render:
    needs: preflight
    if: ${{ needs.preflight.outputs.use_container == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.preflight.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: /app/remotion
    outputs:
      clip_url: ${{ steps.core.outputs.clip_url }}
      audio_verified: ${{ steps.core.outputs.audio_verified }}
      audio_kib: ${{ steps.core.outputs.audio_kib }}
      total_silence_s: ${{ steps.core.outputs.total_silence_s }}
    steps:
      - name: Write input props
        env:
          INPUT_PROPS_JSON: ${{ inputs.input_props }}
        run: printf '%s' "$INPUT_PROPS_JSON" > /tmp/props.json

      - name: Identify narration cache
        if: inputs.composition_id == 'social-eddy-read'
        id: read-key
        run: echo "key=$(node scripts/prepare-read-narration.mjs /tmp/props.json --cache-key)" >> "$GITHUB_OUTPUT"

      - name: Reuse narration for the same full Read and voice
        if: inputs.composition_id == 'social-eddy-read'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/eddy-read-audio
          key: eddy-read-audio-${{ steps.read-key.outputs.key }}

      - name: Render + audio + upload
        id: core
        env:
          COMPOSITION_ID: ${{ inputs.composition_id }}
          OUTPUT_FILENAME: ${{ inputs.output_filename }}
          BLOB_PREFIX: ${{ inputs.blob_prefix }}
          AUDIO_MODE: ${{ inputs.audio_mode }}
          RENDER_MODE: bundle
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: bash scripts/render-core.sh

  # ── Fallback: image unavailable → render on the host the old way (slower).
  runtime-render:
    needs: preflight
    if: ${{ needs.preflight.outputs.use_container != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: missouri-float-planner/remotion
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    outputs:
      clip_url: ${{ steps.core.outputs.clip_url }}
      audio_verified: ${{ steps.core.outputs.audio_verified }}
      audio_kib: ${{ steps.core.outputs.audio_kib }}
      total_silence_s: ${{ steps.core.outputs.total_silence_s }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: missouri-float-planner/remotion/package-lock.json
      - name: Install speech normalization tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Remotion dependencies
        run: npm ci

      - name: Write input props
        env:
          INPUT_PROPS_JSON: ${{ inputs.input_props }}
        run: printf '%s' "$INPUT_PROPS_JSON" > /tmp/props.json

      - name: Identify narration cache
        if: inputs.composition_id == 'social-eddy-read'
        id: read-key
        run: echo "key=$(node scripts/prepare-read-narration.mjs /tmp/props.json --cache-key)" >> "$GITHUB_OUTPUT"

      - name: Reuse narration for the same full Read and voice
        if: inputs.composition_id == 'social-eddy-read'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/eddy-read-audio
          key: eddy-read-audio-${{ steps.read-key.outputs.key }}

      - name: Render + audio + upload
        id: core
        env:
          COMPOSITION_ID: ${{ inputs.composition_id }}
          OUTPUT_FILENAME: ${{ inputs.output_filename }}
          BLOB_PREFIX: ${{ inputs.blob_prefix }}
          AUDIO_MODE: ${{ inputs.audio_mode }}
          RENDER_MODE: entry
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: bash scripts/render-core.sh
