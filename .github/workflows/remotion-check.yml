# .github/workflows/remotion-check.yml
# Guardrail for the Remotion subproject: typecheck + a render smoke test +
# visual regression, so a broken composition (or a token/layout change that
# silently *shifts* the brand) fails in CI instead of at a live clip/reel render.

name: Remotion Check

on:
  pull_request:
    paths:
      - 'missouri-float-planner/remotion/**'
      # The compositions import shared/social-brand, shared/social-route-journey
      # and shared/condition-system; a change there re-renders every reel.
      - 'missouri-float-planner/shared/**'
      - '.github/workflows/remotion-check.yml'
  push:
    branches: [main]
    paths:
      - 'missouri-float-planner/remotion/**'
      - 'missouri-float-planner/shared/**'
  workflow_dispatch:
    inputs:
      update_baselines:
        description: 'Render the check stills and commit them as the new visual baselines (run from the branch carrying the intended visual change).'
        required: false
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # contents:write lets the update_baselines dispatch commit refreshed
    # baselines back to the branch it ran on.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: missouri-float-planner/remotion
    env:
      # Remotion ships its own headless Chrome; skip Puppeteer's download.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: missouri-float-planner/remotion/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Render smoke test
        # Stills of each data-driven composition with its registered defaultProps
        # catch runtime crashes; the frame list lives in test/check-stills.sh so
        # this gate and `npm run render:check-stills` can't drift. clip-reel is
        # skipped — it needs an external source video — so its frame is
        # exercised by the others' shared chrome.
        run: npm run render:check-stills

      # update_baselines mode: adopt the freshly rendered stills as the canonical
      # baselines (generated in THIS runner so anti-aliasing matches the gate) and
      # commit them back to the branch. Run this intentionally when a composition
      # is meant to change.
      - name: Update visual baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baselines }}
        run: |
          npm run test:visual:update
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test/baselines
          if git diff --cached --quiet; then
            echo "Baselines already up to date."
          else
            git commit -m "remotion-check: refresh visual baselines"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      # Default mode: fail if any composition drifts from its committed baseline.
      - name: Visual regression
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_baselines) }}
        run: npm run test:visual

      # Always surface the fresh stills, plus the diff images on a mismatch. On a
      # failure the diffs show what shifted; on ANY run the stills are the
      # CI-rendered files a baseline should be adopted from (sidestepping
      # cross-runner anti-aliasing) — including a green run whose committed
      # baselines were rendered locally and should be replaced with CI's bytes.
      - name: Upload visual diffs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-diffs
          path: |
            /tmp/visual-diffs/
            /tmp/stills/
          if-no-files-found: ignore
