name: Render Daily Report Carousel

on:
  pull_request:
    paths:
      - '.github/workflows/render-daily-report.yml'
      - 'missouri-float-planner/src/components/admin/social/DailyReportSlide.tsx'
      - 'missouri-float-planner/src/components/admin/social/CarouselPreview.tsx'
      - 'missouri-float-planner/src/components/admin/social/daily-report.css'
      - 'missouri-float-planner/src/components/embed/**'
      - 'missouri-float-planner/src/lib/social/daily-report*.ts'
      - 'missouri-float-planner/src/lib/embed/**'
      - 'missouri-float-planner/shared/dam-widget*'
      - 'missouri-float-planner/shared/dam-generation*'
      - 'missouri-float-planner/shared/dam-schedule-copy*'
      - 'missouri-float-planner/shared/dam-types*'
      - 'missouri-float-planner/shared/chart-model*'
      - 'missouri-float-planner/shared/gauge-trend*'
      - 'missouri-float-planner/shared/condition-*'
      - 'missouri-float-planner/src/app/globals.css'
      - 'missouri-float-planner/src/app/embed/report/**'
      - 'missouri-float-planner/scripts/*daily-report*'
      - 'missouri-float-planner/scripts/fixtures/daily-report.ts'
  workflow_dispatch:
    inputs:
      post_ids:
        description: 'Comma-separated Daily Report draft IDs'
        required: true
        type: string

permissions:
  contents: read

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: missouri-float-planner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: missouri-float-planner/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node --import tsx scripts/daily-report-smoke.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: daily-report-preview
          path: |
            /tmp/eddy-daily-report/
            /tmp/eddy-report-next.log
          retention-days: 7
  render:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: missouri-float-planner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: missouri-float-planner/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Capture actual widgets and complete the saved drafts
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          POST_IDS: ${{ inputs.post_ids }}
        run: node scripts/render-daily-report.mjs
      - name: Report preparation failure
        if: failure()
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          POST_IDS: ${{ inputs.post_ids }}
        run: |
          jq -n --arg postIds "$POST_IDS" '{postIds: $postIds, status: "failed"}' > /tmp/report-failure.json
          curl --fail-with-body --max-time 60 --retry 2 \
            -X POST "${SITE_URL}/api/admin/social/carousel-callback" \
            -H "Authorization: Bearer ${CRON_SECRET}" -H 'Content-Type: application/json' \
            --data-binary @/tmp/report-failure.json
