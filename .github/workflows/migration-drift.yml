# Migration drift — is production's migration history what the repo says it is?
#
# PR CI is hermetic on purpose (see app-ci.yml), so `make check-db` — the only
# check that reads the linked Supabase project — never runs there. This
# workflow runs it on a schedule and after pushes to main that touch
# migrations or the ledger, and REPORTS: on drift it opens (or updates) one
# pinned issue naming the rows; when clean it closes that issue. It gates
# nothing. Six drifted rows sat unnoticed for a week in August 2026 because
# nothing looked; this looks.
#
# Secrets it needs, both set in the repository's Actions secrets:
#   SUPABASE_ACCESS_TOKEN  — a personal access token for the Supabase account
#   SUPABASE_DB_PASSWORD   — the linked project's database password
# Without them the workflow warns and exits green rather than crying drift.

name: Migration drift

on:
  schedule:
    - cron: '17 12 * * *'
  push:
    branches: [main]
    paths:
      - 'missouri-float-planner/supabase/migrations/**'
      - 'missouri-float-planner/supabase/production-migrations.txt'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: migration-drift
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ilefwfpvphadsbptiaur
  DRIFT_ISSUE_TITLE: 'Migration drift: production history differs from the repo'

jobs:
  drift:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: missouri-float-planner
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check for credentials
        id: creds
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD are not both set; the drift check did not run. Set them in Actions secrets."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.creds.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: missouri-float-planner/package-lock.json

      - name: Install dependencies
        if: steps.creds.outputs.present == 'true'
        run: npm ci

      - name: Link the production project
        if: steps.creds.outputs.present == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Compare repo files and ledger against production
        if: steps.creds.outputs.present == 'true'
        id: check
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -o pipefail
          npm run --silent db:check-migrations 2>&1 | tee "$RUNNER_TEMP/drift.txt"

      - name: Open or update the drift issue
        if: steps.creds.outputs.present == 'true' && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          body_file="$RUNNER_TEMP/body.md"
          {
            echo "\`make check-db\` found production's migration history differing from the repo on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo
            echo "Fix: rename the file to the version production recorded, or apply the pending migration, then update \`supabase/production-migrations.txt\`. The ledger's header has the rules."
            echo
            echo '```'
            cat "$RUNNER_TEMP/drift.txt"
            echo '```'
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$body_file"
          number=$(gh issue list --state open --search "\"$DRIFT_ISSUE_TITLE\" in:title" --json number,title --jq ".[] | select(.title == \"$DRIFT_ISSUE_TITLE\") | .number" | head -n1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body_file"
          else
            gh issue create --title "$DRIFT_ISSUE_TITLE" --body-file "$body_file"
          fi

      - name: Close the drift issue when clean
        if: steps.creds.outputs.present == 'true' && steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          number=$(gh issue list --state open --search "\"$DRIFT_ISSUE_TITLE\" in:title" --json number,title --jq ".[] | select(.title == \"$DRIFT_ISSUE_TITLE\") | .number" | head -n1)
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Migration histories match again as of $(date -u +%Y-%m-%dT%H:%M:%SZ)."
          fi
