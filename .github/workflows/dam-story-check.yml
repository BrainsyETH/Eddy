name: Dam Story Preview
on:
  pull_request:
    paths:
      - 'missouri-float-planner/shared/**'
      - 'missouri-float-planner/remotion/**'
      - 'missouri-float-planner/src/**/social/**'
      - '.github/workflows/dam-story-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: missouri-float-planner/remotion
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: missouri-float-planner/remotion/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --import tsx --test test/dam-story-motion.test.ts
      - run: node test/dam-story-browser.mjs
      - name: Render isolated motion study
        run: npx remotion render src/index.ts dam-story-motion-study out/dam-story/motion-study.mp4 --codec=h264 --crf=18 --concurrency=2
      - name: Render sample Instagram Story
        run: npx remotion render src/index.ts social-dam-schedule out/dam-story/instagram-story.mp4 --codec=h264 --crf=20 --concurrency=2
      - name: Render sample TikTok
        run: npx remotion render src/index.ts social-dam-schedule out/dam-story/tiktok.mp4 --codec=h264 --crf=20 --concurrency=2 --props='{"platform":"tiktok"}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dam-story-preview
          path: missouri-float-planner/remotion/out/dam-story/
          retention-days: 14
