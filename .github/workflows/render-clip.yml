# .github/workflows/render-clip.yml
# ClipEngine: brand a downloaded clip with Remotion (the clip-reel composition)
# and insert it into clip_library. The raw, UNBRANDED clip is extracted + uploaded
# upstream (cookies/403), then this workflow wraps it in the Eddy frame — branding
# happens here ONLY (no local finalize-reel), so clips are never branded twice.
#
# The render itself runs in the prebuilt container via render-reusable.yml; this
# workflow just builds props (prepare), calls the reusable render, and records
# the result (persist). Kept as workflow_dispatch so the cloud pipeline's
# `gh workflow run render-clip.yml` keeps working unchanged.

name: Render Clip

on:
  workflow_dispatch:
    inputs:
      clip_id:          { description: 'Existing clip_library UUID to replace in place (empty = insert a new row)', required: false, type: string, default: '' }
      video_url:        { description: 'Public URL of the RAW extracted clip', required: true, type: string }
      youtube_video_id: { description: 'Source YouTube video id', required: true, type: string }
      river_slug:       { description: 'Detected river slug (empty = Tier 2, generic Ozark paddling)', required: false, type: string, default: '' }
      river_name:       { description: 'River display name for the frame (empty = generic)', required: false, type: string, default: '' }
      creator:          { description: 'Creator credit: "@instagram" when known (tagged in the caption), else the channel name — see scripts/clipengine/resolve-credit.py', required: false, type: string }
      source_url:       { description: 'Original YouTube URL', required: false, type: string }
      youtube_channel:  { description: 'Source channel name', required: false, type: string }
      peak_number:      { description: 'Heatmap peak index', required: false, type: string, default: '1' }
      duration_secs:    { description: 'Clip length in seconds', required: true, type: string }
      clip_start_secs:  { description: 'Clip start offset in the source', required: false, type: string, default: '0' }
      orientation:      { description: 'portrait | landscape', required: false, type: string, default: 'portrait' }
      heatmap_score:    { description: 'Heatmap score', required: false, type: string, default: '0' }
      captions:         { description: 'Timed caption cues JSON (relative to clip start)', required: false, type: string, default: '[]' }
      source_orientation: { description: 'Orientation of the SOURCE clip (portrait|landscape)', required: false, type: string, default: 'landscape' }
      category:           { description: 'Content category (e.g. high_water) — drives clip branding + clip_library.content_type', required: false, type: string, default: '' }

# contents:read for checkout; packages:read so the reusable render job can pull
# the private GHCR render image with the job's GITHUB_TOKEN.
permissions:
  contents: read
  packages: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      props_json: ${{ steps.props.outputs.props_json }}
    steps:
      # Fail early + clearly if the secrets needed to upload + record the clip are
      # missing, instead of branding a clip that then can't be saved.
      - name: Check required secrets
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=()
          [ -n "$BLOB_READ_WRITE_TOKEN" ] || missing+=("BLOB_READ_WRITE_TOKEN")
          [ -n "$SUPABASE_URL" ] || missing+=("NEXT_PUBLIC_SUPABASE_URL")
          [ -n "$SUPABASE_KEY" ] || missing+=("SUPABASE_SERVICE_ROLE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing Actions secret(s): ${missing[*]}. The branded clip can't be uploaded/inserted. Add them in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "✅ Required secrets present"

      - name: Build input props
        id: props
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          RIVER_NAME: ${{ inputs.river_name }}
          CREATOR: ${{ inputs.creator }}
          DURATION_SECS: ${{ inputs.duration_secs }}
          CAPTIONS: ${{ inputs.captions }}
          SOURCE_ORIENTATION: ${{ inputs.source_orientation }}
          CATEGORY: ${{ inputs.category }}
        run: |
          PROPS=$(python3 - <<'PY'
          import json, os
          props = {
              "videoUrl": os.environ["VIDEO_URL"],
              "riverName": os.environ["RIVER_NAME"],
              "creatorCredit": os.environ.get("CREATOR", ""),
              "durationSecs": float(os.environ.get("DURATION_SECS") or 13),
              "captions": json.loads(os.environ.get("CAPTIONS") or "[]"),
              "sourceOrientation": os.environ.get("SOURCE_ORIENTATION") or "landscape",
          }
          # Only set the category prop when present, so normal clips keep the
          # default branding (ClipReel treats an absent category as a plain clip).
          category = os.environ.get("CATEGORY") or ""
          if category:
              props["category"] = category
          print(json.dumps(props))
          PY
          )
          # Heredoc-delimited output handles any JSON content safely.
          {
            echo "props_json<<__PROPS_EOF__"
            echo "$PROPS"
            echo "__PROPS_EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "props: $PROPS"

  render:
    needs: prepare
    uses: ./.github/workflows/render-reusable.yml
    with:
      composition_id: clip-reel
      input_props: ${{ needs.prepare.outputs.props_json }}
      output_filename: ${{ inputs.youtube_video_id }}-peak${{ inputs.peak_number }}
      blob_prefix: clips
      audio_mode: clip
    secrets: inherit

  persist:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Insert into clip_library (pending)
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLIP_URL: ${{ needs.render.outputs.clip_url }}
          VIDEO_ID: ${{ inputs.youtube_video_id }}
          CHANNEL: ${{ inputs.youtube_channel }}
          CREATOR: ${{ inputs.creator }}
          RIVER_SLUG: ${{ inputs.river_slug }}
          SOURCE_URL: ${{ inputs.source_url }}
          CLIP_START: ${{ inputs.clip_start_secs }}
          DURATION_SECS: ${{ inputs.duration_secs }}
          ORIENTATION: ${{ inputs.orientation }}
          HEATMAP_SCORE: ${{ inputs.heatmap_score }}
          CATEGORY: ${{ inputs.category }}
          CLIP_ID: ${{ inputs.clip_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          start = float(os.environ.get("CLIP_START") or 0)
          dur = float(os.environ.get("DURATION_SECS") or 13)
          row = {
              "youtube_video_id": os.environ["VIDEO_ID"],
              "youtube_channel": os.environ.get("CHANNEL") or None,
              "river_slug": os.environ.get("RIVER_SLUG") or None,
              "clip_url": os.environ["CLIP_URL"],
              "duration_secs": int(dur),
              "clip_start_secs": start,
              "clip_end_secs": start + dur,
              "orientation": os.environ.get("ORIENTATION") or "portrait",
              "heatmap_score": float(os.environ.get("HEATMAP_SCORE") or 0),
              # The credit the reel drew — "@instagram" when known, else the
              # channel name (resolve-credit.py). The caption pipeline tags an
              # "@" credit on Instagram, so this must be the creator input,
              # not the bare channel name it used to be.
              "source_creator": os.environ.get("CREATOR") or os.environ.get("CHANNEL") or None,
              "source_url": os.environ.get("SOURCE_URL") or None,
              "brand_check_status": "pending",
          }
          # Content category (e.g. high_water) so the library + brand-check can
          # tell flood-safety clips apart from normal paddling clips. Only set
          # when present; a plain clip leaves content_type NULL as before.
          if os.environ.get("CATEGORY"):
              row["content_type"] = os.environ["CATEGORY"]

          # Never store a river_slug that isn't a real river — guards manual
          # dispatches / mis-detections so the library stays filterable.
          slug = row["river_slug"]
          if slug:
              try:
                  q = urllib.parse.quote(slug, safe="")
                  vreq = urllib.request.Request(
                      f"{os.environ['SUPABASE_URL']}/rest/v1/rivers?slug=eq.{q}&select=slug",
                      headers={
                          "apikey": os.environ["SUPABASE_KEY"],
                          "Authorization": f"Bearer {os.environ['SUPABASE_KEY']}",
                      })
                  with urllib.request.urlopen(vreq, timeout=10) as vr:
                      if not json.loads(vr.read() or "[]"):
                          print(f"river '{slug}' not in rivers — storing null river_slug")
                          row["river_slug"] = None
              except Exception as e:
                  print(f"river validation skipped: {e}")

          clip_id = os.environ.get("CLIP_ID") or ""
          method = "POST"
          target = f"{os.environ['SUPABASE_URL']}/rest/v1/clip_library"
          if clip_id:
              # A corrected rerender replaces the existing library asset in
              # place. Keep its identity, source metadata, and post history;
              # only replace the rendered media and restart brand review.
              row = {
                  "clip_url": row["clip_url"],
                  "duration_secs": row["duration_secs"],
                  "orientation": row["orientation"],
                  "brand_check_status": "pending",
                  "brand_check_result": None,
                  "brand_check_error": None,
                  "posting_claimed_at": None,
              }
              method = "PATCH"
              target += (
                  f"?id=eq.{urllib.parse.quote(clip_id, safe='')}"
                  f"&youtube_video_id=eq.{urllib.parse.quote(os.environ['VIDEO_ID'], safe='')}"
              )

          req = urllib.request.Request(
              target,
              data=json.dumps(row).encode(),
              headers={
                  "apikey": os.environ["SUPABASE_KEY"],
                  "Authorization": f"Bearer {os.environ['SUPABASE_KEY']}",
                  "Content-Type": "application/json",
                  "Prefer": "return=representation",
              }, method=method)
          with urllib.request.urlopen(req, timeout=15) as r:
              changed = json.loads(r.read() or "[]")
              if len(changed) != 1:
                  raise RuntimeError(
                      f"Expected exactly one clip_library row, changed {len(changed)}"
                  )
              verb = "Replaced" if clip_id else "Inserted"
              print(f"{verb} clip_library: {changed[0]['id']}")
          PY

  # Dispatchers fire-and-forget, so a failed render/persist would otherwise just
  # never appear in the library. Runs if ANY upstream job failed (including the
  # reusable render). Surface it (log + optional site callback).
  report-failure:
    needs: [prepare, render, persist]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Report render failure
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "::error::render-clip failed for ${{ inputs.youtube_video_id }} (peak ${{ inputs.peak_number }}, river ${{ inputs.river_slug }})"
          if [ -n "$SITE_URL" ] && [ -n "$CRON_SECRET" ]; then
            curl -s -X POST "${SITE_URL}/api/admin/clips/callback" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -d "{\"status\": \"failed\", \"error\": \"render-clip failed for ${{ inputs.youtube_video_id }} (${{ inputs.river_slug }})\"}" || true
          fi
