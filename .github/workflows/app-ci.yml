# .github/workflows/app-ci.yml
# CI gate for both apps: dependency audit, SBOM, typecheck, lint, and unit tests
# for the Next.js app, plus typecheck, lint and a PRODUCTION BUNDLE for the Expo
# app. Keeps regressions visible before deploy.
#
# ── Why the path filters reach outside missouri-float-planner ─────────────
#
# The web test suite is where the Expo app's pure logic is covered — the app has
# no test runner of its own, so chunked-store, purchase-copy, notification-copy,
# entitlement-id and app-theme all import or read files under eddy-ios/, and
# geo-tiles and offline-plan import packages/.
#
# So a change to either directory can break tests in this workflow. Filtering on
# missouri-float-planner/** alone meant those changes did not trigger CI at all,
# and the first sign of a break would have been a red build on some later,
# unrelated PR.
#
# The dependency runs BOTH ways, which is why both jobs run on any of these
# paths rather than being filtered per job: missouri-float-planner/shared IS
# the app's @eddy/conditions package, so editing the canonical condition system
# can break the iOS bundle just as easily as editing the app can break a web
# test.

name: App CI

on:
  pull_request:
    paths:
      - 'missouri-float-planner/**'
      - 'eddy-ios/**'
      - 'packages/**'
      - '.easignore'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  push:
    branches: [main]
    paths:
      - 'missouri-float-planner/**'
      - 'eddy-ios/**'
      - 'packages/**'
      - '.easignore'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: missouri-float-planner
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: missouri-float-planner/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Reject high-severity runtime advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Generate CycloneDX SBOM
        run: npm sbom --package-lock-only --sbom-format cyclonedx > "$RUNNER_TEMP/eddy-sbom.cdx.json"

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eddy-sbom-${{ github.sha }}
          path: ${{ runner.temp }}/eddy-sbom.cdx.json
          retention-days: 14

      # The test script names every file explicitly — there is no glob — so a
      # test nobody remembers to add is not a test that fails, it is a test
      # that never runs and looks exactly like a passing one. This step is what
      # makes that mechanical; `make check-web` runs it in the same position.
      - name: Check test registration
        run: npm run check:test-registration

      # Two configs: tsconfig.json is what `next build` uses and covers only
      # shippable code, tsconfig.test.json adds the tests. They are separate
      # because several tests import Expo-app source to cover logic that has no
      # runner of its own, and type-checking that during a Vercel build broke
      # the deploy — Vercel installs only this directory, so the app's
      # node_modules is not there to resolve @eddy/types through.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  mobile-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: eddy-ios
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: eddy-ios/package-lock.json

      # A PLAIN `npm ci`, and that is a recent fix rather than the way it always
      # was. This step carried --legacy-peer-deps and a comment calling it
      # mandatory: react-dom is peer-depended on as "*" by expo, expo-router,
      # @expo/metro-runtime and @rnmapbox/maps and pinned by none of them, so npm
      # resolved the newest one, which peer-requires a react past the 19.2.3 Expo
      # SDK 57 pins. A plain install did fail outright.
      #
      # The diagnosis was right and the remedy was too broad. --legacy-peer-deps
      # does not skip ONE bad peer, it skips peer installation entirely — so this
      # job was building against a tree with no react-native-reanimated, no
      # react-native-gesture-handler and no react-native-worklets in it, none of
      # which is web-only and all of which ship in the app. The `overrides` block
      # in package.json constrains the single offending package instead.
      #
      # This also resolves the `file:` dependencies on ../packages and
      # ../missouri-float-planner/shared, which is why the full repo checkout
      # matters — the same thing EAS relies on.
      - name: Install dependencies
        run: npm ci

      # `npm run typecheck`, not `npx tsc --noEmit`, and the difference is a
      # whole error class. app.json sets experiments.typedRoutes, so route
      # errors are only visible to tsc when .expo/types/router.d.ts exists —
      # and it is gitignored, so a fresh checkout has none. This job typechecked
      # without one for the life of the repo, which means `Href` degraded to
      # something permissive here and a push to a route that does not exist
      # COULD NOT FAIL. Three sat green for a week.
      #
      # The typecheck script now generates the declaration first, so this is the
      # first version of this job that can see them. See eddy-ios/package.json.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # THE STEP THAT EARNS THIS JOB. Typecheck and lint both passed throughout
      # the SDK 57 upgrade while every production bundle was broken: Expo's
      # tsconfig-paths emulation stopped matching exact aliases, and Metro's
      # file map stopped indexing files outside the project root — but only
      # during `expo export`, so `expo start` kept working.
      #
      # A bug class that is invisible in development and fatal in every EAS
      # build needs a production bundle in CI to catch it. Nothing here needs
      # credentials: this compiles the JS bundle, it does not build the app.
      - name: Bundle for iOS
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/expo-export"

      # .easignore is an allowlist, and an allowlist that silently stops
      # matching looks fine until an EAS build fails on the worker. It also
      # disables .gitignore entirely while it exists, so a mistake uploads .env
      # files. Both are asserted here.
      #
      # python3 is preinstalled on ubuntu-latest, so this needs no extra action
      # to pin.
      - name: Check the EAS archive allowlist
        run: |
          # The fallback covers PEP 668 runners, where the system Python is
          # marked externally-managed and a plain install is refused.
          python3 -m pip install --quiet pathspec \
            || python3 -m pip install --quiet --break-system-packages pathspec
          python3 scripts/check-easignore.py
